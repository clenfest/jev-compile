[package]
name = "jev-compile"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
description = "Experimental Jev-powered compiler error prediction from Git diffs"
license = "MIT"
repository = "https://github.com/clenfest/jev-compile"
readme = "README.md"
keywords = ["cli", "compiler", "diagnostics", "ai"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
sha2 = "0.10"
tree-sitter = "0.25.10"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
tempfile = "3"
