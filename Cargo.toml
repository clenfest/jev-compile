[package]
name = "jev-compile"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Experimental Jev-powered compiler error prediction from Git diffs"
license = "MIT"
repository = "https://github.com/clenfest/jev-compile"
readme = "README.md"
keywords = ["cli", "compiler", "diagnostics", "ai"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }

[dev-dependencies]
tempfile = "3"
